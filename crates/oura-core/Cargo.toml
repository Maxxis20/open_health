[package]
name = "oura-core"
description = "UniFFI surface over the shared Oura core — consumed by the iOS/native clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "oura_core"
# lib for the host bins; staticlib for iOS linking; cdylib for library-mode bindgen.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
oura-analysis = { git = "https://github.com/Th0rgal/open_oura", rev = "bd2f1508fbd571b7742b56c0bfd32d8f16e29585" }
oura-store = { git = "https://github.com/Th0rgal/open_oura", rev = "bd2f1508fbd571b7742b56c0bfd32d8f16e29585" }
oura-protocol = { git = "https://github.com/Th0rgal/open_oura", rev = "bd2f1508fbd571b7742b56c0bfd32d8f16e29585" }
oura-summary = { path = "../oura-summary" }
# the ring client + transport trait, WITHOUT btleplug (iOS supplies the transport)
oura-link = { git = "https://github.com/Th0rgal/open_oura", rev = "bd2f1508fbd571b7742b56c0bfd32d8f16e29585", default-features = false }
uniffi = { version = "0.28", features = ["cli", "tokio"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
async-trait = "0.1"
thiserror = "1"
serde_json = "1"

[[bin]]
# `cargo run --bin uniffi-bindgen -- generate --library <dylib> --language swift ...`
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
