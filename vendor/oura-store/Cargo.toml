[package]
name = "oura-store"
description = "SQLite persistence for Oura ring events, samples, metrics and sync state"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Th0rgal/open_oura"

[dependencies]
oura-protocol = { git = "https://github.com/Th0rgal/open_oura", rev = "bd2f1508fbd571b7742b56c0bfd32d8f16e29585" }
rusqlite = { version = "0.31" }
serde_json = "1"
thiserror = "1"

[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
