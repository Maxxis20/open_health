[package]
name = "oura-link"
description = "BLE transport, connection, auth handshake and sync drain for Oura rings"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Th0rgal/open_oura"

[dependencies]
oura-protocol = { git = "https://github.com/Th0rgal/open_oura", rev = "bd2f1508fbd571b7742b56c0bfd32d8f16e29585" }
thiserror = "1"
hex = "0.4"
tracing = "0.1"
uuid = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
async-trait = "0.1"
futures = "0.3"
# BLE backend. Optional so the auth + sync logic (OuraClient, transport-generic)
# can build for iOS, where CoreBluetooth implements the `Transport` trait instead.
btleplug = { version = "0.11", optional = true }

[features]
default = ["ble"]
ble = ["dep:btleplug"]

# The scan example needs the BLE backend, which is off when the iOS build pulls
# this crate in with default features disabled. Without this the example breaks
# `cargo test -p oura-link` in that configuration.
[[example]]
name = "rawscan"
required-features = ["ble"]
